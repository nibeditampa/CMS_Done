<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Profiles Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Print styles to produce a clean PDF (hide background, show content full-width) */
    @media print {
      body { background: white !important; color: #111827 !important; }
      .fixed.inset-0.z-0 { display: none !important; } /* hide background image */
      .relative.z-10 { max-width: 100% !important; padding: 0 !important; }
      header, a[data-link] { display: none !important; }
      #profilesTableContainer { overflow: visible !important; }
      table { page-break-inside: auto; }
      tr { page-break-inside: avoid; page-break-after: auto; }
    }
  </style>
</head>
<body class="min-h-screen font-sans text-slate-700 bg-slate-100">

<div class="relative min-h-screen">

  <!-- Background -->
  <div class="fixed inset-0 z-0">
    <img src="https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?q=80&w=2053&auto=format&fit=crop" 
         alt="Hospital Background" 
         class="w-full h-full object-cover" />
    <div class="absolute inset-0 bg-slate-900/65 backdrop-blur-[3px]"></div>
  </div>

  <div class="relative z-10 max-w-7xl mx-auto p-6 lg:p-10">

    <!-- Header Card -->
    <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl border border-white/20 p-8 mb-10">
      
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-8">
        <div>
          <h1 id="profilesTitle" class="text-3xl font-black text-slate-700 tracking-tight">
            <span class="text-blue-600">Profiles</span> Directory
          </h1>
          <p class="text-slate-500 font-semibold mt-1">Comprehensive records management system.</p>
        </div>

        <a href="/home" data-link
           class="inline-flex items-center gap-2 px-5 py-3 text-sm font-bold bg-slate-700 text-white rounded-lg shadow hover:bg-blue-600 transition">
          ← Back to Dashboard
        </a>
      </div>

      <!-- Tabs -->
      <div class="flex flex-wrap gap-3 mb-8">
        <button data-type="patients" class="profile-tab px-6 py-2 text-sm font-bold rounded-lg bg-blue-600 text-white shadow">
          Patients
        </button>
        <button data-type="doctors" class="profile-tab px-6 py-2 text-sm font-bold rounded-lg bg-white text-blue-600 border shadow hover:bg-blue-600 hover:text-white transition">
          Doctors
        </button>
        <button data-type="bills" class="profile-tab px-6 py-2 text-sm font-bold rounded-lg bg-white text-blue-600 border shadow hover:bg-blue-600 hover:text-white transition">
          Bills
        </button>
      </div>

      <!-- Controls -->
      <div class="bg-slate-100 rounded-2xl p-4 border border-slate-200 shadow-inner">
        <div class="flex flex-col xl:flex-row gap-4 xl:items-center justify-between">
          
          <div class="flex flex-col lg:flex-row gap-3 w-full xl:w-auto">
            <input id="searchInput" type="text" placeholder="Search..."
              class="w-full lg:w-[420px] px-4 h-11 bg-white border border-slate-300 rounded-lg text-sm font-medium
                     focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none shadow-sm" />

            <div class="flex gap-3">
              <select id="sortBy" class="h-11 px-4 bg-white border border-slate-300 rounded-lg text-sm font-semibold shadow-sm">
                <option value="id">Sort: ID</option>
                <option value="name">Sort: Name</option>
              </select>
              <select id="sortDir" class="h-11 px-4 bg-white border border-slate-300 rounded-lg text-sm font-semibold shadow-sm">
                <option value="asc">Asc ↑</option>
                <option value="desc">Desc ↓</option>
              </select>
            </div>
          </div>

          <!-- Export Buttons -->
          <div class="flex gap-3">
            <!-- CSV -->
            <button id="exportCsvBtn"
              class="inline-flex items-center gap-2 px-4 py-2 text-sm font-semibold text-emerald-700 
                     bg-white border border-emerald-200 rounded-lg shadow hover:bg-emerald-600 hover:text-white transition">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16" />
              </svg>
              CSV
            </button>

            <!-- PDF -->
            <button id="exportPdfBtn"
              class="inline-flex items-center gap-2 px-4 py-2 text-sm font-semibold text-rose-600 
                     bg-white border border-rose-200 rounded-lg shadow hover:bg-rose-600 hover:text-white transition">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 16v-8m0 0l-4 4m4-4l4 4M4 20h16" />
              </svg>
              PDF
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Table Card -->
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
      
      <div id="loadingSpinner" class="flex flex-col justify-center items-center py-24 bg-white">
        <div class="h-16 w-16 rounded-xl border-8 border-slate-100 border-t-blue-600 animate-spin"></div>
        <span class="mt-4 text-sm font-bold tracking-widest text-slate-400 uppercase">Loading...</span>
      </div>

      <div id="profilesTableContainer" class="hidden overflow-x-auto">
        <table class="w-full text-left border-collapse min-w-[1000px]">
          <thead>
            <tr id="tableHead" class="bg-slate-700 text-sm font-bold text-white uppercase">
            </tr>
          </thead>
          <tbody id="profilesTableBody" class="divide-y divide-slate-100 text-sm font-medium text-slate-700 bg-white">
          </tbody>
        </table>

        <div id="noProfiles" class="hidden flex flex-col items-center justify-center py-24 bg-white">
          <p class="text-xl font-bold text-slate-600 italic">No Matching Records Found</p>
        </div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
